<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>札幌民泊 価格判断MVP v2</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #fff;
      --text: #17202a;
      --muted: #64748b;
      --line: #d9e2ec;
      --accent: #0f766e;
      --accent-soft: #e0f2f1;
      --warn: #b45309;
      --warn-soft: #fff4db;
      --down: #b91c1c;
      --down-soft: #fee2e2;
      --keep: #475569;
      --keep-soft: #eef2f7;
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      font-family: "Segoe UI", "Yu Gothic UI", "Hiragino Sans", Meiryo, sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }

    header {
      background: #12343b;
      color: #fff;
      padding: 22px 28px;
      border-bottom: 5px solid #2ca58d;
    }

    h1 { margin: 0; font-size: 24px; letter-spacing: 0; }
    h2, h3 { letter-spacing: 0; }

    .subtitle {
      margin: 8px 0 0;
      color: #d4e7e4;
      font-size: 14px;
      line-height: 1.6;
    }

    main {
      width: min(1200px, calc(100% - 32px));
      margin: 24px auto 40px;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
      align-items: start;
    }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .panel-title {
      margin: 0;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      font-size: 17px;
    }

    form {
      padding: 18px;
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 10px 11px;
      font: inherit;
      color: var(--text);
      background: #fff;
    }

    input:focus, select:focus {
      outline: 3px solid rgba(15, 118, 110, 0.18);
      border-color: var(--accent);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .actions {
      display: flex;
      gap: 10px;
      padding-top: 4px;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 10px 14px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }

    button.secondary { background: #e2e8f0; color: #1e293b; }

    .summary {
      padding: 18px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      border-bottom: 1px solid var(--line);
    }

    .metric {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      min-height: 98px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .metric strong {
      display: block;
      margin-top: 8px;
      font-size: 23px;
      line-height: 1.18;
      overflow-wrap: anywhere;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .badge.up { color: var(--warn); background: var(--warn-soft); }
    .badge.down { color: var(--down); background: var(--down-soft); }
    .badge.keep { color: var(--keep); background: var(--keep-soft); }
    .badge.high { color: #065f46; background: #d1fae5; }
    .badge.medium { color: #92400e; background: #fef3c7; }
    .badge.low { color: #991b1b; background: #fee2e2; }

    .note {
      margin: 0;
      padding: 14px 18px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      line-height: 1.7;
      font-size: 14px;
    }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 880px;
    }

    th, td {
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      font-size: 14px;
    }

    th {
      color: var(--muted);
      background: #f8fafc;
      font-size: 12px;
      white-space: nowrap;
    }

    .reason { max-width: 340px; line-height: 1.55; }

    .factors {
      padding: 18px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .factor {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      background: #fbfdff;
      font-size: 13px;
      display: grid;
      gap: 8px;
    }

    .factor-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .factor-name { color: var(--muted); font-weight: 800; }
    .factor-value { font-size: 18px; font-weight: 900; }
    .factor p { margin: 0; color: var(--muted); line-height: 1.55; }

    @media (max-width: 960px) {
      main { grid-template-columns: 1fr; }
      .summary, .factors { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>札幌民泊 価格判断MVP v2</h1>
    <p class="subtitle">推奨価格に加えて、係数の根拠レベルと信頼スコアを表示します。現段階の係数は「統計的に証明済み」ではなく、MVP用の仮説として扱います。</p>
  </header>

  <main>
    <section>
      <h2 class="panel-title">入力</h2>
      <form id="priceForm">
        <label>
          対象日
          <input id="targetDate" type="date">
        </label>

        <div class="row">
          <label>
            曜日区分
            <select id="dayType">
              <option value="weekday">平日</option>
              <option value="friday">金曜</option>
              <option value="saturday">土曜</option>
              <option value="holiday">祝日・連休</option>
            </select>
          </label>
          <label>
            地域イベント
            <select id="eventLevel">
              <option value="none">なし</option>
              <option value="small">小規模</option>
              <option value="large" selected>大型イベント</option>
            </select>
          </label>
        </div>

        <div class="row">
          <label>
            基準価格
            <input id="basePrice" type="number" min="0" step="500" value="12000">
          </label>
          <label>
            現在価格
            <input id="currentPrice" type="number" min="0" step="500" value="14000">
          </label>
        </div>

        <div class="row">
          <label>
            最低価格
            <input id="minPrice" type="number" min="0" step="500" value="8000">
          </label>
          <label>
            上限価格
            <input id="maxPrice" type="number" min="0" step="500" value="35000">
          </label>
        </div>

        <div class="row">
          <label>
            ホテル平均価格
            <input id="hotelPrice" type="number" min="0" step="500" value="18000">
          </label>
          <label>
            Airbnb競合価格
            <input id="airbnbPrice" type="number" min="0" step="500" value="16000">
          </label>
        </div>

        <div class="row">
          <label>
            予約状況
            <select id="occupancy">
              <option value="low">低い</option>
              <option value="normal" selected>普通</option>
              <option value="high">高い</option>
            </select>
          </label>
          <label>
            残日数
            <input id="leadDays" type="number" min="0" step="1" value="3">
          </label>
        </div>

        <div class="actions">
          <button type="submit">計算する</button>
          <button class="secondary" type="button" id="sampleButton">サンプル値</button>
        </div>
      </form>
    </section>

    <section>
      <h2 class="panel-title">価格判断</h2>
      <div class="summary">
        <div class="metric">
          <span>推奨価格</span>
          <strong id="recommendedPrice">-</strong>
        </div>
        <div class="metric">
          <span>保守的レンジ</span>
          <strong id="priceRange">-</strong>
        </div>
        <div class="metric">
          <span>現在価格との差</span>
          <strong id="priceDiff">-</strong>
        </div>
        <div class="metric">
          <span>判定</span>
          <strong><span id="decisionBadge" class="badge keep">-</span></strong>
        </div>
      </div>

      <p class="note" id="confidenceNote">-</p>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>対象日</th>
              <th>曜日</th>
              <th>イベント</th>
              <th>ホテル平均</th>
              <th>競合価格</th>
              <th>現在価格</th>
              <th>推奨価格</th>
              <th>信頼スコア</th>
              <th>理由</th>
            </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>

      <h3 class="panel-title">係数の信ぴょう性</h3>
      <div class="factors" id="factorList"></div>
    </section>
  </main>

  <script>
    const yen = new Intl.NumberFormat("ja-JP", {
      style: "currency",
      currency: "JPY",
      maximumFractionDigits: 0
    });

    const form = document.querySelector("#priceForm");
    const inputs = {
      targetDate: document.querySelector("#targetDate"),
      dayType: document.querySelector("#dayType"),
      basePrice: document.querySelector("#basePrice"),
      currentPrice: document.querySelector("#currentPrice"),
      minPrice: document.querySelector("#minPrice"),
      maxPrice: document.querySelector("#maxPrice"),
      hotelPrice: document.querySelector("#hotelPrice"),
      airbnbPrice: document.querySelector("#airbnbPrice"),
      eventLevel: document.querySelector("#eventLevel"),
      occupancy: document.querySelector("#occupancy"),
      leadDays: document.querySelector("#leadDays")
    };

    const labels = {
      weekday: "平日",
      friday: "金曜",
      saturday: "土曜",
      holiday: "祝日・連休",
      none: "なし",
      small: "小規模",
      large: "大型イベント",
      low: "低い",
      normal: "普通",
      high: "高い"
    };

    const confidenceLabels = {
      high: "高",
      medium: "中",
      low: "低"
    };

    const confidenceScore = {
      high: 0.9,
      medium: 0.65,
      low: 0.35
    };

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function roundToNearest(value, unit) {
      return Math.round(value / unit) * unit;
    }

    function getSeasonFactor(targetDate) {
      if (!targetDate) return 1;
      const month = Number(targetDate.slice(5, 7));
      if ([2, 7, 8, 12].includes(month)) return 1.15;
      if ([1, 6, 9].includes(month)) return 1.06;
      return 1;
    }

    function getHotelFactor(hotelPrice, basePrice) {
      if (!hotelPrice || !basePrice) return 1;
      const ratio = hotelPrice / basePrice;
      if (ratio >= 1.8) return 1.25;
      if (ratio >= 1.4) return 1.15;
      if (ratio <= 0.85) return 0.95;
      return 1;
    }

    function getAirbnbFactor(airbnbPrice, basePrice) {
      if (!airbnbPrice || !basePrice) return 1;
      const ratio = airbnbPrice / basePrice;
      if (ratio >= 1.35) return 1.15;
      if (ratio >= 1.1) return 1.08;
      if (ratio <= 0.85) return 0.92;
      return 1;
    }

    function getLeadTimeFactor(leadDays, occupancy) {
      if (leadDays <= 3 && occupancy !== "high") return 0.9;
      if (leadDays <= 7 && occupancy === "low") return 0.95;
      if (leadDays >= 45 && occupancy === "high") return 1.08;
      return 1;
    }

    function buildFactors(values) {
      return [
        {
          key: "day",
          name: "曜日係数",
          value: { weekday: 1, friday: 1.12, saturday: 1.2, holiday: 1.25 }[values.dayType],
          confidence: "medium",
          basis: "一般的に週末・連休は上がりやすいが、札幌の自社物件データで未検証。"
        },
        {
          key: "season",
          name: "季節係数",
          value: getSeasonFactor(values.targetDate),
          confidence: "medium",
          basis: "札幌の季節性をルール化。月単位なので雪まつりなど個別イベントは別扱いが必要。"
        },
        {
          key: "event",
          name: "イベント係数",
          value: { none: 1, small: 1.12, large: 1.3 }[values.eventLevel],
          confidence: "low",
          basis: "イベント規模の入力が手動で、来訪者数・会場距離・競合在庫をまだ見ていない。"
        },
        {
          key: "hotel",
          name: "ホテル価格係数",
          value: getHotelFactor(values.hotelPrice, values.basePrice),
          confidence: values.hotelPrice > 0 ? "medium" : "low",
          basis: "ホテル価格は需要の代理指標として有効。ただし入力価格の取得元・対象ホテル数で精度が変わる。"
        },
        {
          key: "airbnb",
          name: "Airbnb競合係数",
          value: getAirbnbFactor(values.airbnbPrice, values.basePrice),
          confidence: values.airbnbPrice > 0 ? "medium" : "low",
          basis: "周辺競合との比較は有効。ただし部屋サイズ・立地・レビュー差を補正していない。"
        },
        {
          key: "occupancy",
          name: "予約状況係数",
          value: { low: 0.95, normal: 1, high: 1.12 }[values.occupancy],
          confidence: "medium",
          basis: "自社の予約状況は強い材料。ただし市場全体の空室率ではないため過信は禁物。"
        },
        {
          key: "leadTime",
          name: "残日数係数",
          value: getLeadTimeFactor(values.leadDays, values.occupancy),
          confidence: "high",
          basis: "対象日までの日数は客観データ。直前空室の値下げルールとして使いやすい。"
        }
      ];
    }

    function calculateConfidence(factors) {
      const total = factors.reduce((sum, factor) => sum + confidenceScore[factor.confidence], 0);
      return Math.round((total / factors.length) * 100);
    }

    function buildReasons(values, factors, recommended) {
      const reasons = [];
      if (values.dayType !== "weekday") reasons.push(`${labels[values.dayType]}で需要増を想定`);
      if (factors.find((factor) => factor.key === "season").value > 1) reasons.push("札幌の季節需要を反映");
      if (values.eventLevel !== "none") reasons.push(`${labels[values.eventLevel]}あり`);
      if (factors.find((factor) => factor.key === "hotel").value > 1) reasons.push("ホテル価格が基準より高い");
      if (factors.find((factor) => factor.key === "airbnb").value > 1) reasons.push("競合Airbnb価格が高め");
      if (factors.find((factor) => factor.key === "leadTime").value < 1) reasons.push("直前空室のため調整");
      if (recommended === values.minPrice) reasons.push("最低価格で下限調整");
      if (recommended === values.maxPrice) reasons.push("上限価格で抑制");
      return reasons.length ? reasons.join("・") : "大きな価格変更要因なし";
    }

    function calculate() {
      const values = {
        targetDate: inputs.targetDate.value,
        dayType: inputs.dayType.value,
        basePrice: Number(inputs.basePrice.value),
        currentPrice: Number(inputs.currentPrice.value),
        minPrice: Number(inputs.minPrice.value),
        maxPrice: Number(inputs.maxPrice.value),
        hotelPrice: Number(inputs.hotelPrice.value),
        airbnbPrice: Number(inputs.airbnbPrice.value),
        eventLevel: inputs.eventLevel.value,
        occupancy: inputs.occupancy.value,
        leadDays: Number(inputs.leadDays.value)
      };

      const factors = buildFactors(values);
      const multiplier = factors.reduce((product, factor) => product * factor.value, 1);
      const rawPrice = values.basePrice * multiplier;
      const minPrice = Math.min(values.minPrice, values.maxPrice);
      const maxPrice = Math.max(values.minPrice, values.maxPrice);
      const recommended = roundToNearest(clamp(rawPrice, minPrice, maxPrice), 500);
      const confidence = calculateConfidence(factors);

      const uncertaintyRate = confidence >= 75 ? 0.08 : confidence >= 60 ? 0.12 : 0.18;
      const rangeLow = roundToNearest(clamp(recommended * (1 - uncertaintyRate), minPrice, maxPrice), 500);
      const rangeHigh = roundToNearest(clamp(recommended * (1 + uncertaintyRate), minPrice, maxPrice), 500);

      const diff = recommended - values.currentPrice;
      const diffRate = values.currentPrice ? diff / values.currentPrice : 0;
      let decision = "維持";
      let badgeClass = "keep";
      if (diffRate >= 0.08) {
        decision = "値上げ推奨";
        badgeClass = "up";
      } else if (diffRate <= -0.08) {
        decision = "値下げ推奨";
        badgeClass = "down";
      }

      const reason = buildReasons(values, factors, recommended);
      render(values, factors, recommended, rangeLow, rangeHigh, diff, decision, badgeClass, reason, confidence);
    }

    function render(values, factors, recommended, rangeLow, rangeHigh, diff, decision, badgeClass, reason, confidence) {
      document.querySelector("#recommendedPrice").textContent = yen.format(recommended);
      document.querySelector("#priceRange").textContent = `${yen.format(rangeLow)} - ${yen.format(rangeHigh)}`;
      document.querySelector("#priceDiff").textContent = `${diff >= 0 ? "+" : ""}${yen.format(diff)}`;

      const badge = document.querySelector("#decisionBadge");
      badge.textContent = decision;
      badge.className = `badge ${badgeClass}`;

      const scoreClass = confidence >= 75 ? "high" : confidence >= 60 ? "medium" : "low";
      document.querySelector("#confidenceNote").innerHTML =
        `信頼スコア: <span class="badge ${scoreClass}">${confidence}%</span>。この価格は確定値ではなく、係数仮説にもとづく判断材料です。特にイベント係数と競合価格係数は、実績データが集まるまで保守的に見るべきです。`;

      document.querySelector("#resultBody").innerHTML = `
        <tr>
          <td>${values.targetDate || "-"}</td>
          <td>${labels[values.dayType]}</td>
          <td>${labels[values.eventLevel]}</td>
          <td>${yen.format(values.hotelPrice)}</td>
          <td>${yen.format(values.airbnbPrice)}</td>
          <td>${yen.format(values.currentPrice)}</td>
          <td><strong>${yen.format(recommended)}</strong></td>
          <td><span class="badge ${scoreClass}">${confidence}%</span></td>
          <td class="reason">${reason}</td>
        </tr>
      `;

      document.querySelector("#factorList").innerHTML = factors.map((factor) => `
        <div class="factor">
          <div class="factor-head">
            <span class="factor-name">${factor.name}</span>
            <span class="badge ${factor.confidence}">根拠 ${confidenceLabels[factor.confidence]}</span>
          </div>
          <div class="factor-value">x${factor.value.toFixed(2)}</div>
          <p>${factor.basis}</p>
        </div>
      `).join("");
    }

    function setToday() {
      const today = new Date();
      const offset = today.getTimezoneOffset() * 60000;
      inputs.targetDate.value = new Date(today - offset).toISOString().slice(0, 10);
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      calculate();
    });

    Object.values(inputs).forEach((input) => {
      input.addEventListener("input", calculate);
      input.addEventListener("change", calculate);
    });

    document.querySelector("#sampleButton").addEventListener("click", () => {
      inputs.basePrice.value = 12000;
      inputs.currentPrice.value = 14000;
      inputs.minPrice.value = 8000;
      inputs.maxPrice.value = 35000;
      inputs.hotelPrice.value = 18000;
      inputs.airbnbPrice.value = 16000;
      inputs.dayType.value = "saturday";
      inputs.eventLevel.value = "large";
      inputs.occupancy.value = "normal";
      inputs.leadDays.value = 3;
      calculate();
    });

    setToday();
    calculate();
  </script>
</body>
</html>
